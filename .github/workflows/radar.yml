      - name: Contrôler les sources et envoyer les alertes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RADAR_STATUS: ${{ github.event_name != 'schedule' }}
        shell: bash
        run: |
          if [ "$RADAR_STATUS" = "true" ]; then
            python3 /tmp/radar-code/radar.py --status
          else
            python3 /tmp/radar-code/radar.py
          fi
      - name: Enregistrer les fiches pour réparer le lecteur
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-fiches
          path: /tmp/radar-diagnostic/
          retention-days: 3
          if-no-files-found: ignore
      - name: Conserver les alertes déjà envoyées
        if: always()
        shell: bash
        run: |
          if [ ! -f data/state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mémoriser les alertes du radar"
          git pull --rebase origin main
          git push origin HEAD:main
